# Managed by devenv (copy/gha_std). Edit it there, not in a child repo.
#
# The standard pipeline: lint, test and build (devenv-check), then PyPI, then
# the release. A project that needs its own jobs drops DEVENV_GHA_STD and
# owns its ci.yml, composing the same devenv-* building blocks; see the
# devenv README for the rules.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# A newer push cancels a pull request's run, but a started main run always
# finishes: cancelling it could cut between the PyPI publish and the tag. A
# main push waits for it instead, and only the newest waiting run starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required check is "CI / Lint, Test & Build Dist".
  ci:
    name: CI
    uses: ./.github/workflows/devenv-check.yml
    permissions:
      contents: read
      actions: read
      packages: write
      checks: write

  pypi:
    name: Publish to PyPI
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.ci.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/actions

      - name: Publish to PyPI
        uses: ./.github/actions/devenv-pypi
        with:
          token: ${{ secrets.PYPI_TOKEN }}

  release:
    name: Release
    needs: [ci, pypi]
    if: ${{ !cancelled() && needs.ci.outputs.release == 'true' && needs.pypi.result == 'success' }}
    uses: ./.github/workflows/devenv-release.yml
    permissions:
      contents: write
